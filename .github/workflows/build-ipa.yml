name: Build TrollStore IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install build tools
        run: |
          brew install xcodegen cmake cocoapods || true
          xcodegen --version
          pod --version

      - name: Cache whisper.xcframework
        id: whispercache
        uses: actions/cache@v4
        with:
          path: ThirdParty/whisper.xcframework
          key: whisper-xcframework-v1

      - name: Build whisper.xcframework
        if: steps.whispercache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git whisper-src
          cd whisper-src
          chmod +x build-xcframework.sh
          ./build-xcframework.sh
          mkdir -p "$GITHUB_WORKSPACE/ThirdParty"
          rm -rf "$GITHUB_WORKSPACE/ThirdParty/whisper.xcframework"
          cp -R build-apple/whisper.xcframework "$GITHUB_WORKSPACE/ThirdParty/"
          ls -la "$GITHUB_WORKSPACE/ThirdParty/whisper.xcframework"

      - name: Cache onnxruntime.xcframework
        id: ortcache
        uses: actions/cache@v4
        with:
          path: ThirdParty/onnxruntime.xcframework
          key: onnxruntime-xcframework-v3

      - name: Fetch onnxruntime.xcframework
        if: steps.ortcache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ThirdParty
          curl -fL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ort-libs.zip "https://github.com/minfeitang996-star/zhuju-player/releases/download/deps-ort-1.28.0/onnxruntime-libs-1.28.0.zip"
          unzip -q ort-libs.zip
          rm -rf ThirdParty/onnxruntime.xcframework
          mv onnxruntime.xcframework ThirdParty/
          ls -la ThirdParty/onnxruntime.xcframework

      - name: Patch ORT headers (strip exception specifiers)
        run: |
          find ThirdParty/onnxruntime.xcframework -name '*.h' -print0 | while IFS= read -r -d '' h; do
            sed -E -i '' 's/^([[:space:]]*#[[:space:]]*define[[:space:]]+NO_EXCEPTION).*/\1/' "$h"
          done
          grep -rc NO_EXCEPTION ThirdParty/onnxruntime.xcframework/ios-arm64/Headers || true

      - name: Generate Xcode project
        run: |
          ls -d ThirdParty/whisper.xcframework
          xcodegen generate

      - name: CocoaPods install
        run: pod install --repo-update

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ZhuJu.xcworkspace \
            -scheme ZhuJu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee build.log | tail -n 300

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/ZhuJu.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          echo "===== embedded frameworks ====="
          ls -la Payload/ZhuJu.app/Frameworks || true
          echo "===== dyld deps check ====="
          MISS=0
          for dep in $(otool -L Payload/ZhuJu.app/ZhuJu | grep "@rpath" | awk '{print $1}'); do
            name=$(echo "$dep" | sed 's|@rpath/||')
            if [ ! -e "Payload/ZhuJu.app/Frameworks/$name" ]; then
              echo "MISSING: $name"
              MISS=1
            else
              echo "OK: $name"
            fi
          done
          if [ "$MISS" != "0" ]; then echo "动态库缺失，包一定闪退，中止"; exit 1; fi
          for fw in Payload/ZhuJu.app/Frameworks/*.framework; do
            [ -d "$fw" ] && codesign --force --sign - "$fw"
          done
          codesign --force --sign - Payload/ZhuJu.app
          echo "===== final signature ====="
          codesign -dv --verbose=4 Payload/ZhuJu.app 2>&1 || true
          zip -qry ZhuJu.ipa Payload
          ls -lh ZhuJu.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZhuJu-ipa-${{ matrix.runner }}
          path: ZhuJu.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.runner }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
