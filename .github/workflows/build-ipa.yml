name: Build TrollStore IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          ls /Applications | grep -i xcode
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install build tools
        run: |
          brew install xcodegen cmake cocoapods || true
          xcodegen --version
          pod --version

      - name: Build whisper.xcframework
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git whisper-src
          cd whisper-src
          chmod +x build-xcframework.sh
          ./build-xcframework.sh
          ls -la build-apple
          mkdir -p "$GITHUB_WORKSPACE/ThirdParty"
          rm -rf "$GITHUB_WORKSPACE/ThirdParty/whisper.xcframework"
          cp -R build-apple/whisper.xcframework "$GITHUB_WORKSPACE/ThirdParty/"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: CocoaPods install
        run: pod install --repo-update

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ZhuJu.xcworkspace \
            -scheme ZhuJu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee build.log | tail -n 300

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/ZhuJu.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign --force --deep --sign - Payload/ZhuJu.app
          codesign -dv Payload/ZhuJu.app 2>&1 | head -5 || true
          zip -qry ZhuJu.ipa Payload
          ls -lh ZhuJu.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZhuJu-ipa
          path: ZhuJu.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
