name: ZhuJu
options:
  bundleIdPrefix: com.zhuju
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    MARKETING_VERSION: "1.6.6"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    SWIFT_COMPILATION_MODE: "wholemodule"

targets:
  ZhuJu:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - framework: ThirdParty/whisper.xcframework
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhuju.player
        PRODUCT_NAME: ZhuJu
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "$(inherited) -lc++ -lz"
        ARCHS: "arm64"
        ONLY_ACTIVE_ARCH: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ZhuJu/Info.plist
      properties:
        CFBundleDisplayName: 糖敏飞视频播放器
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        LSRequiresIPhoneOS: true
        UIBackgroundModes:
          - audio
        NSFaceIDUsageDescription: 用于解锁加密的视频文件夹；识别不出来时可输入设备密码。
        NSMicrophoneUsageDescription: 用来拾取外放里的人在说话，实时识别并翻译成中文字幕。音频不保存、不上传，识别完全在本机完成。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false







